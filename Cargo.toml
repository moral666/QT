[workspace]
resolver = "2"
members = ["core", "transport", "server", "demo", "cli", "storage", "ffi"]

# Binarios de release (incluindo libqt_ffi.so para Android): sem simbolos de
# debug, otimizacao entre crates. NAO usar panic = "abort": o UniFFI apanha
# panics do Rust e converte-os em excecoes Kotlin; com abort a app morria.
# Os bindings UniFFI tem de ser gerados a partir da build DEBUG (como faz
# ffi/generate_bindings.sh): de um .so "stripped" o uniffi-bindgen nao gera nada.
[profile.release]
strip = true
lto = true
codegen-units = 1

# A prova de trabalho (Argon2id, qt_core::pow) e muito lenta sem otimizacao: nos
# testes (perfil dev) estas bibliotecas compilam otimizadas, o resto nao.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
