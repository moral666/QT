name: Dependências

# Procura avisos de segurança (RustSec) nas dependências do Rust.
# Corre à parte do CI porque um aviso novo aparece sem ninguém mexer no código: assim não põe
# vermelho um push que não tem culpa. Corre todos os dias, sempre que as dependências mudam
# (Cargo.lock ou um Cargo.toml) e à mão (Actions > Dependências > Run workflow).

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main, develop]
    paths:
      - "Cargo.lock"
      - "**/Cargo.toml"
      - ".github/workflows/dependencias.yml"
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit (CVEs em dependências)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: cargo audit
        # Desde a 1.0.3 o SQLCipher embutido (rusqlite 0.42: SQLCipher 4.20 com SQLite 3.54.1) ja traz
        # a correcao do RUSTSEC-2026-0459: nada fica ignorado.
        run: |
          cargo install cargo-audit --locked
          cargo audit
