name: CI

# Um push ou pull request que só mexe no site, na documentação ou em ficheiros .md não corre
# estes testes: nada disso entra no código Rust. Os avisos de segurança das dependências
# (cargo audit) correm à parte, em dependencias.yml.

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"
  push:
    branches: [develop, main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**.md"

jobs:
  test-workspace:
    name: Testar workspace (core + transport + server + demo)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # O SQLCipher (crate storage) é compilado a partir do código-fonte, como nas apps
      # (feature bundled-sqlcipher). Antes instalava-se o libsqlcipher-dev com o apt, e o CI
      # falhava sempre que as máquinas do GitHub não chegavam aos servidores do Ubuntu.

      - name: cargo test --workspace (sem PQXDH)
        run: cargo test --workspace --features qt_storage/bundled-sqlcipher --verbose

      - name: cargo test (core com PQXDH, exige Rust 1.81+)
        working-directory: core
        run: cargo test --features pq --verbose

      - name: Gerar e testar bindings FFI (Python)
        # Os testes Python usam a API antiga (bytes de chaves na FFI), que so
        # existe com a feature `legacy-api`; as apps nunca a ativam.
        run: |
          cargo build -p qt_ffi --features legacy-api,qt_storage/bundled-sqlcipher
          mkdir -p ffi/bindings
          cargo run -p qt_ffi --features legacy-api,qt_storage/bundled-sqlcipher --bin uniffi-bindgen -- \
            generate --library target/debug/libqt_ffi.so --language python --out-dir ffi/bindings
          cp target/debug/libqt_ffi.so ffi/bindings/
          python3 ffi/tests/test_ffi_bindings.py
          python3 ffi/tests/test_noise_session.py

      - name: cargo clippy (lint estrito)
        run: cargo clippy --workspace --all-targets --features qt_storage/bundled-sqlcipher -- -D warnings

  # TODO: adicionar jobs de build reprodutível (Nix) e build Android/iOS
  # quando essas camadas existirem.
