[package]
name = "qt_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Servidor/relay: fila de mensagens cifradas + diretorio de pre-keys publicas"
publish = false

[dependencies]
qt_transport = { path = "../transport" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
redis = { version = "0.25", features = ["tokio-comp"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
qt_core = { path = "../core" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
