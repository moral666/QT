[package]
name = "qt_server"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Servidor/relay: fila de mensagens cifradas + diretorio de pre-keys publicas"
publish = false

[dependencies]
qt_transport = { path = "../transport", features = ["tls"] }
qt_core = { path = "../core" }
ed25519-dalek = { version = "2" }
rand = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }
base64 = "0.22"
sha2 = "0.10"
# Notificacoes (push.rs): HTTPS para a Google (FCM) e o JWT da conta de servico.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
# Relay das chamadas (call_relay.rs): reserva por WebSocket e chaves apagadas da memoria.
tokio-tungstenite = "0.24"
futures-util = "0.3"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
base64 = "0.22"
qt_ffi = { path = "../ffi", features = ["calls"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tokio = { version = "1", features = ["full", "test-util"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
