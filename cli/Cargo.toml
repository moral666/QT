[package]
name = "qt_cli"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Demo de terminal: liga core + transport + server numa conversa real, visivel"
publish = false

[lib]
name = "qt_cli"
path = "src/lib.rs"

[dependencies]
qt_core = { path = "../core" }
qt_transport = { path = "../transport" }
qt_server = { path = "../server" }
qt_storage = { path = "../storage" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
