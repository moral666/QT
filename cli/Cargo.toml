[package]
name = "qt_cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
description = "SEALER no terminal (messenger) e demo visivel do protocolo (messenger_demo)"
publish = false

[lib]
name = "qt_cli"
path = "src/lib.rs"

[dependencies]
qt_core = { path = "../core" }
qt_transport = { path = "../transport", features = ["tls"] }
qt_server = { path = "../server" }
qt_storage = { path = "../storage" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2" }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
# Prompt interativo da passphrase, mascarado com '*'.
inquire = "0.7"
zeroize = "1"
# `messenger`: o mesmo nucleo que as apps (QtClient) e o mesmo caminho para o relay.
qt_ffi = { path = "../ffi" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Passphrase -> chaves (Argon2id) e sal aleatorio.
argon2 = "0.5"
getrandom = "0.2"
