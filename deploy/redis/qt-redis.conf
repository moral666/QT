# =============================================================================
# Redis do relay QT - so acessivel a partir da propria maquina.
#
# Instalar (Ubuntu/Debian na EC2):
#   sudo cp deploy/redis/qt-redis.conf /etc/redis/qt-redis.conf
#   sudo chown redis:redis /etc/redis/qt-redis.conf && sudo chmod 640 /etc/redis/qt-redis.conf
#   # na ultima linha de /etc/redis/redis.conf:
#   include /etc/redis/qt-redis.conf
#   sudo systemctl restart redis-server
#
# Verificar:
#   sudo ss -tlnp | grep 6379        -> so 127.0.0.1:6379 e [::1]:6379
#   redis-cli -h <IP-privado-da-EC2> ping   -> tem de FALHAR (connection refused)
# =============================================================================

# ---- Rede: apenas loopback ----
# 127.0.0.1 e ::1. O "-" antes de ::1 faz o Redis arrancar mesmo sem IPv6.
bind 127.0.0.1 -::1
# Recusa ligacoes de fora do loopback mesmo que alguem altere o bind por engano.
protected-mode yes
port 6379
# Sem TLS no Redis: o trafego nunca sai da maquina.
tls-port 0

# ---- Autenticacao (defesa em profundidade contra SSRF / outros processos locais) ----
# Gera com:  openssl rand -hex 32   (hex: nao precisa de escape no URL)
# e usa o MESMO valor em REDIS_URL=redis://qt-relay:<password>@127.0.0.1:6379
# (no ficheiro de ambiente do systemd, NUNCA na linha de comandos).
# O utilizador "default" fica desligado. O utilizador do relay so pode tocar nas
# chaves com o prefixo do relay ("default:" = Store::new) e so nos comandos que o
# relay usa (lista validada contra a suite de testes do servidor). Os comandos
# de hash, DEL e DECRBY sao dos anexos (server/src/blobs.rs); o teste
# `server/tests/redis_acl.rs` corre o relay com esta mesma lista.
user default off
user qt-relay on >SUBSTITUI_POR_PASSWORD_FORTE ~default:* -@all +get +set +rpush +expire +lrange +lrem +llen +incr +incrby +decrby +del +hset +hmset +hget +hgetall +ping +hello +auth +select +multi +exec +discard

# Para administracao local, cria um utilizador proprio com outra password, ex.:
# user admin on >OUTRA_PASSWORD ~* &* +@all
# (CONFIG/FLUSHALL/KEYS/DEBUG ficam assim fora do alcance do relay.)

# ---- Persistencia e limites ----
# As filas so tem envelopes cifrados, mas sao metadados: nada de dump.rdb em
# diretorios de trabalho/repositorios.
dir /var/lib/redis
appendonly yes
appendfsync everysec
maxmemory 512mb
maxmemory-policy noeviction
timeout 300
