[package]
name = "qt_demo"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

[lib]
name = "qt_demo"
path = "src/lib.rs"

# So ha o teste de ponta a ponta (tests/): tudo e dependencia de teste.
[dev-dependencies]
qt_core = { path = "../core" }
qt_transport = { path = "../transport" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
tokio = { version = "1", features = ["full", "test-util"] }
