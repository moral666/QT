[package]
name = "secure_messenger_demo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "secure_messenger_demo"
path = "src/lib.rs"

[dependencies]
secure_messenger_core = { path = "../core" }
secure_messenger_transport = { path = "../transport" }
tokio = { version = "1", features = ["full"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
